name: Build and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily rebuild picks up Alpine security updates (nginx, PHP, OpenSSL...).
    - cron: '23 3 * * *'
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
        required: true
      publish:
        description: "'true' to push images to GHCR"
        type: string
        default: 'true'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Regression tests and lint
        run: |
          php -l src/bridge.php
          php -l src/initialize.php
          php -l tests/patches-test.php
          sh -n docker-entrypoint.sh
          sh -n scripts/check-nginx-version.sh
          sh scripts/check-nginx-version.sh 1.30.7
          ! sh scripts/check-nginx-version.sh 1.31.8
          sh -n scripts/fetch-github-archive.sh
          sh tests/pinning-test.sh
          python3 tests/sync-upstream-test.py
          python3 tests/upstream-workflow-test.py
          python3 scripts/sync-upstream.py

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          pull: true
          tags: ttrss:e2e
          cache-from: type=gha
      - name: Maintenance smoke test
        run: TEST_IMAGE=ttrss:e2e sh tests/maintenance-smoke.sh
      - name: Feed fetching end-to-end test
        run: IMAGE=ttrss:e2e sh tests/e2e.sh

  publish:
    needs: [test, e2e]
    # 只发布 main 上的提交；候选分支（含手动触发）只验证不发布。
    if: github.event_name != 'pull_request' && inputs.publish != 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/ttrss:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/ttrss:${{ steps.version.outputs.tag }}-${{ steps.version.outputs.date }}
            ghcr.io/${{ github.repository_owner }}/ttrss:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test published image
        env:
          TEST_IMAGE: ghcr.io/${{ github.repository_owner }}/ttrss:${{ steps.version.outputs.tag }}-${{ steps.version.outputs.date }}
          SMOKE_PULL: '1'
        run: sh tests/maintenance-smoke.sh
